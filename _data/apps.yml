# Daily Utility Apps portfolio — listing metadata only (name, tagline,
# icon, store links). Never put page content here: an app with page: true
# gets its full content in its own page's front matter (see app.html in
# STATUS.md section 4). This file only drives the homepage apps grid and
# the footer's app list.
#
# Names, taglines and package IDs below were taken directly from each
# app's live Google Play listing (screenshots supplied by the user,
# 28 Sep) — not invented. Taglines are inferred from the listing's title
# and icon only, not a full "About this app" description, so review them
# before they go live. No ratings or download counts are stored here on
# purpose: the site never shows them (STATUS.md section 6, "no star
# ratings or review scores anywhere on the site").
#
# tier: flagship (exactly one) or more. Every app gets its own page under
#   the app.html layout (user, 28 Sep — corrects the earlier "more apps
#   are cards only" plan). tier now controls prominence only: the
#   flagship gets the header nav link, the hero spotlight, and top
#   billing on the homepage grid; "more" apps still get a real page, just
#   not that same front-and-centre treatment.
# page: true for all four, accordingly — every app.yml entry has a real
#   page (or will). Kept as an explicit field, not assumed, in case a
#   fifth app is ever added as a store-only listing before its page
#   exists.
# built controls whether that page has actually been published yet (same
#   true/false-until-published pattern as fixmypcperth's suburbs.yml) —
#   nav/footer never link to a page that isn't live. Flips true per app
#   as each one ships in step 5-6, not all at once.
# ios_url is omitted where an app isn't confirmed to exist on iOS.

