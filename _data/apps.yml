# Daily Utility Apps portfolio — listing metadata only (name, tagline,
# glyph/tone, store links). Never put page content here: an app with page: true
# gets its full content in its own page's front matter (see app.html in
# STATUS.md section 4). This file only drives the homepage apps grid and
# the footer's app list.
#
# Names and package IDs below were taken directly from each app's live
# Google Play listing (screenshots supplied by the user, 28 Sep) — not
# invented. Taglines are inferred from the listing title and package ID
# only (no "About this app" description was ever supplied), so they
# claim only what those establish: no "automatic", "fast", "secure" or
# "one tap" — those were cut in step 5 for exactly that reason. Review
# them against the real store descriptions. No ratings or download
# counts are stored here on purpose: the site never shows them (STATUS.md
# section 6, "no star ratings or review scores anywhere on the site").
#
# tier: flagship (exactly one) or more. Every app gets its own page under
#   the app.html layout (user, 28 Sep — corrects the earlier "more apps
#   are cards only" plan). tier controls prominence only: the flagship
#   gets the header nav link, the homepage hero and spotlight; "more" apps
#   get a real page and a homepage card, not that front-and-centre spot.
# page: true for all four — every entry has a real page. Kept as an
#   explicit field, not assumed, in case a fifth app is ever added as a
#   store-only listing before its page exists.
# built controls whether that page has actually been published (same
#   true/false-until-published pattern as fixmypcperth's suburbs.yml) —
#   the homepage grid, footer and "other apps" lists only ever link to a
#   built page. All four are built as of step 5.
# glyph + tone: the app's visual everywhere on the site, via
#   _includes/app-tile.html (an icon-sprite symbol on a coloured tile).
#   The real store icons are never used (user, 29 Sep: "never use actual
#   logo"); tones are defined in shell.css's "App tiles".
# ios_url is omitted where an app isn't confirmed to exist on iOS; every
#   page and card derives "iPhone and Android" vs "Android" from it.
# Each tagline must match its app page's own `tagline:` front matter.

- slug: cloud-storage-backup-drive
