# Homepage copy that has a repeating shape. The homepage includes
# (_includes/home/) loop over these lists, so wording changes here and the
# markup never has to be touched.
#
# Every statement is sourced, never invented:
#   jobs     -> each app's page (features, FAQ) and the Daily Info guides
#   switch   -> daily-info/backup-before-switching-phones.md
#   privacy  -> privacy-policy.md (sections noted per item)

# "Which kind of app do you need?" -- what each kind of app is for.
# app: an apps.yml slug. keeps_copy: the honest one-line answer to
# "is this a backup?".
jobs:
  - name: "Back up"
    app: cloud-storage-backup-drive
    does: "Keeps a separate copy of your photos, videos, contacts and app data off your phone, ready to restore onto the same phone or a new one."
    when: "Before anything goes wrong: a lost or broken phone, a factory reset, a repair or an upgrade."
    keeps_copy: "Yes. The copy stays off your phone until you restore it."
  - name: "Transfer"
    app: smartphone-data-transfer
    does: "Moves photos, videos and files from one phone to another."
    when: "Setting up a new phone, or sending a batch of photos to someone nearby."
    keeps_copy: "No. A transfer fills the other phone. It doesn't keep a copy anywhere else."
  - name: "Recover"
    app: photo-recover-data-recovery
    does: "Looks through your phone's trash bin and restores deleted photos and files that are still there."
    when: "As soon as you notice something's missing. Trash folders empty themselves, often after 30 days."
    keeps_copy: "No. It can only bring back what the trash still holds."
  - name: "Read"
    app: document-reader-pdf
    does: "Opens PDF, Word, Excel and PowerPoint files in one app."
    when: "A contract, a timetable or a set of slides arrives by email, chat or download."
    keeps_copy: "No. It opens files that are already on your phone."

# "Switching phones?" -- the order the guide recommends.
switch:
  - title: "Back up the old phone"
    text: "Back up your photos, videos, contacts and app data with Cloud Storage Backup & Drive. Large libraries can take hours the first time, so start a few days early and check the backup has finished."
  - title: "Move what you need"
    text: "Restore your backup onto the new phone, or on Android send photos, videos and files straight across with Smartphone All Data Transfer."
  - title: "Check before you reset"
    text: "On the new phone, open photos from different years, search for a few contacts and open your chat apps. Keep the old phone untouched for a week or two before you wipe it."

# "How we handle your data" -- privacy-policy.md (the owner's document of
# 8 Sep 2026), paraphrased, never widened. The comment on each line names
# the policy section it comes from.
privacy:
  - icon: shield
    title: "Your files aren't sold"
    text: "We don't sell your private files, photos, videos, audio, documents or contacts, and we only use them to provide the features you ask for."   # How we use information; How information may be shared
  - icon: lock
    title: "Permissions you control"
    text: "Our apps only access your photos, contacts or files for the features you use, and you can change or revoke any permission in your phone's settings."   # Media, contacts and Android storage permissions
  - icon: trash
    title: "Delete your account and data"
    text: "Ask in the app, where the app supports it, or by email. Once your request is processed, your personal information and cloud data are deleted or anonymised, unless we're required to keep some."   # Account and data deletion
  - icon: toggle
    title: "Tracking permission on iPhone"
    text: "On iPhone, we ask before any tracking that needs Apple's App Tracking Transparency permission. Saying no keeps the app's basic features working, and you can change it later in Settings."   # Advertising and tracking
