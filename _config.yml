title: Daily Utility
description: Simple, focused utility apps for Android and iPhone, from CloudGate Technologies.

# No custom domain yet, so this deploys to the default GitHub Pages project
# URL. url + baseurl combine (via Jekyll's relative_url / absolute_url
# filters) to build every canonical, share and sitemap address, so this is
# the one place to change when a custom domain is connected later:
#   1. set url to the new domain, e.g. "https://dailyutility.app"
#   2. set baseurl to ""
#   3. add a CNAME file with the domain name
# Every link in the site uses relative_url instead of a hardcoded path, so
# no page needs editing when that switch happens.
url: "https://ali-rajaa.github.io"
baseurl: "/daily-utility"

# Jekyll keeps the .html extension in each page's own permalink, but GitHub
# Pages serves the extensionless address too (it tries path, path.html,
# then path/index.html). Every link and canonical on the site is built by
# stripping ".html" so nothing is ever linked with the extension showing.

plugins: []

company:
  legal_name: "CloudGate Technologies Pty Limited"
  acn: "ACN 673 209 553"
  address_line1: "10 Seddon Way"
  address_line2: "Canning Vale WA 6155, Australia"
  support_email: "support@cloudgate-app.com"

# staging: true adds noindex to every page. There is only one copy of this
# site right now, so it stays false; flip it if a staging copy is ever
# deployed separately, the same way fixmypcperth does.
staging: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github
