title: Daily Utility
description: Simple, focused utility apps for Android and iPhone, from CloudGate Technologies.

# ---------------------------------------------------------------------------
# Site address. Two states; see STATUS.md section 7.
#
#   Preview (now)    url: "https://ali-rajaa.github.io"   baseurl: "/daily-utility"   staging: true
#   Live (cutover)   url: "https://dailyutilityapps.store" baseurl: ""                staging: false
#
# Every internal link goes through relative_url and every full URL through
# absolute_url, and both read these two values, so the switch is these
# three lines and nothing else. The custom domain itself is set in the
# repo's Settings > Pages > Custom domain: Actions deployments ignore a
# CNAME file.
# ---------------------------------------------------------------------------
url: "https://ali-rajaa.github.io"
baseurl: "/daily-utility"

# true adds noindex to every page, so the preview copy can never be indexed
# under the github.io address. Set to false only at the cutover.
staging: true

# Pages are served without the .html extension: GitHub Pages answers /x
# from x.html. Jekyll's own permalinks keep the extension, so the layouts
# strip ".html" whenever they build a link or canonical.

timezone: Australia/Perth

plugins: []

# Fail the build on a Liquid or front matter mistake instead of shipping a
# page with the mistake rendered into it. strict_variables stays off on
# purpose: optional front matter (css, image, noindex) is read as unset.
strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true

company:
  legal_name: "CloudGate Technologies Pty Limited"
  acn: "ACN 673 209 553"
  address_line1: "10 Seddon Way"
  address_line2: "Canning Vale WA 6155, Australia"
  support_email: "support@cloudgate-app.com"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - STATUS.md
  - .github
  - .claude
  - _launch
  - vendor
