<section class="ap-section ap-privacy" aria-labelledby="privacy-title">
  <div class="ap-wrap">
    <header class="ap-head reveal">
      <span class="ap-privacy-mark" aria-hidden="true"><svg><use href="#i-lock"/></svg></span>
      <h2 id="privacy-title">How we handle your data.</h2>
      <p>These are the commitments in our privacy policy, in plain words. The policy itself covers every app and this website.</p>
      <a class="ap-link" href="{{ '/privacy-policy' | relative_url }}">Read the privacy policy<svg aria-hidden="true"><use href="#i-chevron-down"/></svg></a>
    </header>
    <ul class="ap-privacy-grid">
      {%- for item in site.data.home.privacy %}
      <li class="ap-privacy-card reveal">
        <svg aria-hidden="true"><use href="#i-{{ item.icon }}"/></svg>
        <h3>{{ item.title | escape }}</h3>
        <p>{{ item.text | escape }}</p>
      </li>
      {%- endfor %}
    </ul>
  </div>
</section>
