{%- comment -%}
  Shared behaviour for every page: header scroll state, the phone menu and
  reveal-on-scroll. Each block checks for its own elements and does
  nothing when they are absent, so any page can include this safely.
{%- endcomment -%}
<script>
(function () {
  'use strict';

  /* iOS Safari only applies :active while a touch listener exists, so
     without this the instant press feedback on buttons never shows. */
  document.addEventListener('touchstart', function () {}, { passive: true });

  var header = document.getElementById('site-header');

  /* ---- Header scroll state ----
     The hairline and shadow appear only once content is under the header,
     tracked by a 1px sentinel at the top of the page (no scroll listener). */
  var sentinel = document.getElementById('scroll-sentinel');
  if (header && sentinel && 'IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      header.classList.toggle('is-scrolled', !entries[0].isIntersecting);
    }).observe(sentinel);
  }

  /* ---- Phone menu ----
     One function sets the state, so the class, aria-expanded and the
     button label never disagree. Closes on a link tap, a tap outside,
     Escape (focus returns to the button), focus leaving the header, and
     the window widening past the breakpoint where the button disappears. */
  var toggle = document.getElementById('nav-toggle');
  var nav = document.getElementById('site-nav');
  if (header && toggle && nav) {
    var isOpen = function () { return header.classList.contains('nav-open'); };
    var setMenu = function (open, returnFocus) {
      header.classList.toggle('nav-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      if (!open && returnFocus) toggle.focus();
    };

    toggle.addEventListener('click', function () { setMenu(!isOpen()); });

    nav.addEventListener('click', function (e) {
      if (e.target.closest('a')) setMenu(false);
    });

    document.addEventListener('click', function (e) {
      if (isOpen() && !header.contains(e.target)) setMenu(false);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isOpen()) setMenu(false, true);
    });

    header.addEventListener('focusout', function (e) {
      if (isOpen() && e.relatedTarget && !header.contains(e.relatedTarget)) setMenu(false);
    });

    var desktop = window.matchMedia('(min-width: 760px)');
    var onBreakpoint = function (e) { if (e.matches) setMenu(false); };
    if (desktop.addEventListener) desktop.addEventListener('change', onBreakpoint);
    else if (desktop.addListener) desktop.addListener(onBreakpoint);
  }

  /* ---- Reveal on scroll ----
     .reveal-ready (which hides .reveal content) is added only after the
     observer that shows it again exists. If anything here fails, the
     content simply stays visible. */
  try {
    var reveals = document.querySelectorAll('.reveal');
    if (reveals.length && 'IntersectionObserver' in window) {
      var revealer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            revealer.unobserve(entry.target);
          }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.1 });
      reveals.forEach(function (el) { revealer.observe(el); });
      document.documentElement.classList.add('reveal-ready');
    }
  } catch (err) {
    document.documentElement.classList.remove('reveal-ready');
  }
})();
</script>
